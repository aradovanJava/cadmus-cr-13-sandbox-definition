---
# CADMUS-CR-13 · Secure Coding .NET/C# (BTCMP-02) · sandbox provisioning
#
#   sq1   VM3  SonarQube (SAST) in Docker   Ubuntu 24.04
#   owz1  VM2  OWASP ZAP (DAST) in Docker   Ubuntu 24.04
#   sc1   VM1  developer workstation        Windows (see topology.yml), RDP
#
# The Linux hosts go first: they are quick, and it lets SonarQube finish its
# first start-up while the Windows workstation is still being provisioned.
# All tunables are in group_vars/all.yml.

# =============================================================================
#  SQ1 + OWZ1 - base system, trainee account, Docker Engine
# =============================================================================
- name: Docker hosts (SQ1, OWZ1) - base system, trainee account, Docker
  hosts:
    - sq1
    - owz1
  become: true

  pre_tasks:
    - name: Stop unattended upgrades so they cannot hold the apt lock
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Wait for any apt/dpkg run started at boot to finish
      ansible.builtin.shell: |
        for i in $(seq 1 120); do
          fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1 || exit 0
          sleep 5
        done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

  roles:
    - role: ansible-role-user-access
      user_access_username: "{{ cr13_trainee_user }}"
      user_access_password: "{{ cr13_trainee_password }}"
      user_access_sudo: false

  tasks:
    - name: Install Docker Engine and Compose v2 from the Ubuntu archive
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
        state: present
        update_cache: true
      register: cr13_apt
      retries: 3
      delay: 20
      until: cr13_apt is succeeded

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Let the trainee run docker without sudo
      ansible.builtin.user:
        name: "{{ cr13_trainee_user }}"
        groups: docker
        append: true

    - name: Resolve the lab machines by name
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} CADMUS-CR-13 lab hosts"
        block: |
          {{ cr13_ip_sc1 }} sc1
          {{ cr13_ip_sq1 }} sq1
          {{ cr13_ip_owz1 }} owz1

    - name: Compose project directory /opt/cr13
      ansible.builtin.file:
        path: /opt/cr13
        state: directory
        owner: root
        group: docker
        mode: "0775"

# =============================================================================
#  SQ1 (VM3) - SonarQube Community Build
# =============================================================================
- name: SQ1 (VM3) - SonarQube Community Build
  hosts: sq1
  become: true

  tasks:
    - name: Kernel settings required by SonarQube's embedded Elasticsearch
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        content: |
          vm.max_map_count=524288
          fs.file-max=131072
        mode: "0644"
      register: cr13_sysctl

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      when: cr13_sysctl is changed
      changed_when: true

    - name: Pull SonarQube (first registry that answers is used)
      ansible.builtin.shell: |
        for img in {{ cr13_sonarqube_images | join(' ') }}; do
          for attempt in 1 2 3; do
            if docker pull --quiet "$img" >/dev/null 2>&1; then
              echo "$img"
              exit 0
            fi
            sleep 15
          done
        done
        echo "could not pull any of: {{ cr13_sonarqube_images | join(' ') }}" >&2
        exit 1
      args:
        executable: /bin/bash
      register: cr13_sq_pull
      changed_when: false

    - name: Write /opt/cr13/docker-compose.yml
      ansible.builtin.template:
        src: sq1-docker-compose.yml.j2
        dest: /opt/cr13/docker-compose.yml
        mode: "0644"
      vars:
        cr13_sonarqube_image: "{{ cr13_sq_pull.stdout | trim }}"

    - name: Start SonarQube, or only create the container (cr13_autostart_tools)
      ansible.builtin.command:
        cmd: "docker compose {{ 'up -d' if cr13_autostart_tools else 'create' }}"
        chdir: /opt/cr13
      changed_when: true

    - name: Wait until SonarQube reports UP (first start takes a few minutes)
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/api/system/status
        return_content: true
      register: cr13_sq_status
      until: cr13_sq_status.json is defined and cr13_sq_status.json.status == 'UP'
      retries: 60
      delay: 10
      when: cr13_autostart_tools

# =============================================================================
#  OWZ1 (VM2) - OWASP ZAP, desktop UI served through Webswing
# =============================================================================
- name: OWZ1 (VM2) - OWASP ZAP
  hosts: owz1
  become: true

  tasks:
    - name: Pull the ZAP image
      ansible.builtin.command: docker pull --quiet {{ cr13_zap_image }}
      register: cr13_zap_pull
      retries: 3
      delay: 15
      until: cr13_zap_pull is succeeded
      changed_when: false

    - name: ZAP working directory (the container runs as uid 1000)
      ansible.builtin.file:
        path: /opt/cr13/zap-wrk
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: Write /opt/cr13/docker-compose.yml
      ansible.builtin.template:
        src: owz1-docker-compose.yml.j2
        dest: /opt/cr13/docker-compose.yml
        mode: "0644"

    - name: Start ZAP, or only create the container (cr13_autostart_tools)
      ansible.builtin.command:
        cmd: "docker compose {{ 'up -d' if cr13_autostart_tools else 'create' }}"
        chdir: /opt/cr13
      changed_when: true

    - name: Wait for the ZAP web UI
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/zap/
        status_code: [200, 302]
      register: cr13_zap_ui
      until: cr13_zap_ui is succeeded
      retries: 30
      delay: 10
      when: cr13_autostart_tools


# =============================================================================
#  SC1 (VM1) - Windows developer workstation
# =============================================================================
- name: SC1 (VM1) - Windows developer workstation
  hosts: sc1
  gather_facts: false

  pre_tasks:
    - name: Wait until SC1 accepts management connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 1800

    - name: Make sure OpenSSH Server exists (the user-access role configures it)
      ansible.windows.win_shell: |
        if (Get-Service sshd -ErrorAction SilentlyContinue) { 'present'; exit 0 }
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
        Set-Service sshd -StartupType Automatic
        Start-Service sshd
        'installed'
      register: cr13_sshd
      changed_when: "'installed' in cr13_sshd.stdout"
      failed_when: false

  roles:
    - role: ansible-role-user-access-windows
      user_access_username: "{{ cr13_trainee_user }}"
      user_access_password: "{{ cr13_trainee_password }}"
      user_access_rdp: true
      user_access_admin: true

  tasks:
    # --- account and folders --------------------------------------------------
    - name: Keep the trainee password from expiring during the course
      ansible.windows.win_user:
        name: "{{ cr13_trainee_user }}"
        password_never_expires: true

    - name: Folders for tools, lab material and installers
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - C:\Tools\bin
        - C:\Tools\dotnet-tools
        - "{{ cr13_lab_dir }}"
        - C:\Windows\Temp\cr13

    - name: Put the tool folders on the machine PATH
      ansible.windows.win_path:
        elements:
          - C:\Tools\bin
          - C:\Tools\dotnet-tools
        scope: machine
        state: present

    # --- software stack (framework section 2.1, VM1) -------------------------
    - name: Chocolatey packages
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item }}"
        state: present
      loop: "{{ cr13_choco_packages }}"
      register: cr13_choco
      retries: 3
      delay: 30
      until: cr13_choco is succeeded

    - name: .NET SDKs (Microsoft dotnet-install script, side by side)
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $script = 'C:\Windows\Temp\cr13\dotnet-install.ps1'
        Invoke-WebRequest -Uri '{{ cr13_dotnet_install_script }}' -OutFile $script -UseBasicParsing
        foreach ($channel in @('{{ cr13_dotnet_channels | join("','") }}')) {
          & $script -Channel $channel -InstallDir '{{ cr13_dotnet_dir }}' -NoPath
          if (-not $?) { throw "dotnet-install failed for channel $channel" }
        }
        & '{{ cr13_dotnet_dir }}\dotnet.exe' --list-sdks
      register: cr13_dotnet
      retries: 3
      delay: 30
      until: cr13_dotnet is succeeded
      changed_when: false

    - name: Make dotnet available to every account
      ansible.windows.win_path:
        elements: '{{ cr13_dotnet_dir }}'
        scope: machine
        state: present

    - name: .NET environment (root, no telemetry, no first-run banner)
      ansible.windows.win_environment:
        level: machine
        variables:
          DOTNET_ROOT: '{{ cr13_dotnet_dir }}'
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

    - name: .NET tools, machine-wide in C:\Tools\dotnet-tools (dotnet-sonarscanner)
      ansible.windows.win_shell: |
        $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'; $env:DOTNET_NOLOGO = '1'
        & '{{ cr13_dotnet_dir }}\dotnet.exe' tool install {{ item }} --tool-path C:\Tools\dotnet-tools --allow-roll-forward
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install {{ item }} failed with exit code $LASTEXITCODE" }
      args:
        creates: 'C:\Tools\dotnet-tools\{{ item }}.exe'
      loop: "{{ cr13_dotnet_tools }}"
      register: cr13_dotnet_tools_result
      retries: 3
      delay: 20
      until: cr13_dotnet_tools_result is succeeded

    - name: Download Oracle JDK 25 (for Apache Maven; latest update, NFTC licence)
      ansible.windows.win_get_url:
        url: "{{ cr13_jdk_msi_url }}"
        dest: C:\Windows\Temp\cr13\jdk-25_windows-x64_bin.msi
      register: cr13_jdk_dl
      retries: 3
      delay: 20
      until: cr13_jdk_dl is succeeded

    - name: Install JDK 25 and set JAVA_HOME
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $jdk = Get-ChildItem 'C:\Program Files\Java' -Directory -Filter 'jdk-25*' -ErrorAction SilentlyContinue | Select-Object -First 1
        $state = 'present'
        if (-not $jdk) {
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', 'C:\Windows\Temp\cr13\jdk-25_windows-x64_bin.msi',
            '/qn', '/norestart', '/l*v', 'C:\Windows\Temp\cr13\jdk-25-install.log')
          if ($p.ExitCode -notin 0, 3010) { throw "JDK installer exit code $($p.ExitCode)" }
          $jdk = Get-ChildItem 'C:\Program Files\Java' -Directory -Filter 'jdk-25*' | Select-Object -First 1
          $state = 'installed'
        }
        if (-not $jdk) { throw 'JDK 25 not found under C:\Program Files\Java' }
        [Environment]::SetEnvironmentVariable('JAVA_HOME', $jdk.FullName, 'Machine')
        "$state JAVA_HOME=$($jdk.FullName)"
      register: cr13_jdk
      changed_when: "'installed' in cr13_jdk.stdout"

    - name: Add %JAVA_HOME%\bin to the machine PATH
      ansible.windows.win_path:
        elements: '%JAVA_HOME%\bin'
        scope: machine
        state: present

    - name: Snyk CLI
      ansible.windows.win_get_url:
        url: "{{ cr13_snyk_url }}"
        dest: C:\Tools\bin\snyk.exe
        force: false
      register: cr13_snyk
      retries: 3
      delay: 20
      until: cr13_snyk is succeeded

    - name: Keep Defender away from the SQLMap checkout (it ships test payloads)
      ansible.windows.win_shell: Add-MpPreference -ExclusionPath 'C:\Tools\sqlmap'
      changed_when: false
      failed_when: false

    - name: SQLMap (clone of the official repository)
      ansible.windows.win_shell: |
        $env:GIT_TERMINAL_PROMPT = '0'; $env:GCM_INTERACTIVE = 'never'
        & 'C:\Program Files\Git\cmd\git.exe' clone --quiet --depth 1 {{ cr13_sqlmap_repo }} C:\Tools\sqlmap
        if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
      args:
        creates: C:\Tools\sqlmap\sqlmap.py
      register: cr13_sqlmap
      retries: 3
      delay: 20
      until: cr13_sqlmap is succeeded

    - name: SQLMap command on the PATH
      ansible.windows.win_copy:
        dest: C:\Tools\bin\sqlmap.cmd
        content: "@echo off\r\npython \"C:\\Tools\\sqlmap\\sqlmap.py\" %*\r\n"

    - name: Postman (per-user installer, so it is installed as the trainee)
      chocolatey.chocolatey.win_chocolatey:
        name: postman
        state: present
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ cr13_trainee_user }}"
      vars:
        ansible_become_password: "{{ cr13_trainee_password }}"
      when: cr13_install_postman
      register: cr13_postman
      ignore_errors: true

    - name: VS Code extensions for C# (installed into the trainee's profile)
      ansible.windows.win_shell: |
        $code = 'C:\Program Files\Microsoft VS Code\bin\code.cmd'
        if (-not (Test-Path $code)) { throw "VS Code not found at $code" }
        foreach ($ext in @('{{ cr13_vscode_extensions | join("','") }}')) {
          & $code --install-extension $ext --force 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { throw "code --install-extension $ext failed with exit code $LASTEXITCODE" }
        }
        & $code --list-extensions
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ cr13_trainee_user }}"
      vars:
        ansible_become_password: "{{ cr13_trainee_password }}"
      register: cr13_vscode_ext
      retries: 2
      delay: 20
      until: cr13_vscode_ext is succeeded
      changed_when: false
      ignore_errors: true

    # --- networking between the three lab machines ---------------------------
    - name: Resolve the lab machines by name
      ansible.windows.win_shell: |
        $hosts = 'C:\Windows\System32\drivers\etc\hosts'
        $entries = [ordered]@{ 'sc1' = '{{ cr13_ip_sc1 }}'; 'sq1' = '{{ cr13_ip_sq1 }}'; 'owz1' = '{{ cr13_ip_owz1 }}' }
        $lines = @(Get-Content $hosts -ErrorAction SilentlyContinue | Where-Object {
          $_ -notmatch ('^\s*\S+\s+(' + (($entries.Keys) -join '|') + ')\s*$') })
        foreach ($name in $entries.Keys) { $lines += "$($entries[$name]) $name" }
        Set-Content -Path $hosts -Value $lines -Encoding ASCII
        Clear-DnsClientCache
      changed_when: false

    # localhost:9000 -> SQ1:9000 keeps the repository's scan script (which
    # expects SonarQube on localhost) working unchanged.
    # sc1:5080 -> 127.0.0.1:5080 lets ZAP on OWZ1 reach the application while
    # the application itself stays bound to loopback; the firewall rule admits
    # that port from OWZ1 only.
    - name: Port forwarding for SonarQube and for the ZAP target, firewall rule
      ansible.windows.win_shell: |
        Set-Service iphlpsvc -StartupType Automatic
        Start-Service iphlpsvc
        netsh interface portproxy reset | Out-Null
        netsh interface portproxy add v4tov4 listenaddress=127.0.0.1 listenport=9000 connectaddress={{ cr13_ip_sq1 }} connectport=9000 | Out-Null
        netsh interface portproxy add v6tov4 listenaddress=::1 listenport=9000 connectaddress={{ cr13_ip_sq1 }} connectport=9000 | Out-Null
        netsh interface portproxy add v4tov4 listenaddress={{ cr13_ip_sc1 }} listenport={{ cr13_app_port }} connectaddress=127.0.0.1 connectport={{ cr13_app_port }} | Out-Null
        Get-NetFirewallRule -Name 'CR13-VulnShop-OWZ1' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
        New-NetFirewallRule -Name 'CR13-VulnShop-OWZ1' -DisplayName 'CADMUS-CR-13 VulnShop {{ cr13_app_port }} - OWASP ZAP host only' `
          -Direction Inbound -Protocol TCP -LocalPort {{ cr13_app_port }} -RemoteAddress {{ cr13_ip_owz1 }} -Action Allow -Profile Any | Out-Null
        netsh interface portproxy show v4tov4
      register: cr13_portproxy
      changed_when: false

    # --- lab material ----------------------------------------------------------
    - name: Clone the application under test
      ansible.windows.win_shell: |
        $env:GIT_TERMINAL_PROMPT = '0'; $env:GCM_INTERACTIVE = 'never'
        & 'C:\Program Files\Git\cmd\git.exe' clone --quiet {{ cr13_app_repo }} '{{ cr13_app_dir }}'
        if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
      args:
        creates: '{{ cr13_app_dir }}\{{ cr13_app_project }}'
      register: cr13_clone
      retries: 3
      delay: 20
      until: cr13_clone is succeeded

    - name: Hand the lab folder to the trainee (git refuses repositories owned by another user)
      ansible.windows.win_shell: |
        icacls '{{ cr13_lab_dir }}' /setowner {{ cr13_trainee_user }} /T /C /Q | Out-Null
        icacls '{{ cr13_lab_dir }}' /grant '{{ cr13_trainee_user }}:(OI)(CI)F' /T /C /Q | Out-Null
        & 'C:\Program Files\Git\cmd\git.exe' config --system --replace-all safe.directory '*'
      changed_when: false

    # Restores the NuGet packages into the trainee's own cache and proves the
    # participant build compiles. A failure here fails the sandbox on purpose:
    # a workstation whose application does not build is not usable for A2.
    - name: Restore and build the application once, as the trainee
      ansible.windows.win_shell: |
        $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'; $env:DOTNET_NOLOGO = '1'
        Set-Location '{{ cr13_app_dir }}'
        & '{{ cr13_dotnet_dir }}\dotnet.exe' build '{{ cr13_app_project }}' -c Debug 2>&1 | ForEach-Object { "$_" }
        if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ cr13_trainee_user }}"
      vars:
        ansible_become_password: "{{ cr13_trainee_password }}"
      register: cr13_build
      retries: 3
      delay: 30
      until: cr13_build is succeeded
      changed_when: false

    - name: Sandbox environment check and PATH helper
      ansible.windows.win_template:
        src: "{{ item.src }}"
        dest: '{{ cr13_lab_dir }}\{{ item.dest }}'
      loop:
        - { src: verify-cr-env.ps1.j2, dest: verify-cr-env.ps1 }
        - { src: fix-path.ps1.j2, dest: fix-path.ps1 }

    - name: README on the desktop
      ansible.windows.win_template:
        src: sc1-README.txt.j2
        dest: C:\Users\Public\Desktop\CR-13 Sandbox README.txt

    - name: Shortcuts on the desktop
      ansible.windows.win_copy:
        dest: 'C:\Users\Public\Desktop\{{ item.name }}.url'
        content: "[InternetShortcut]\r\nURL={{ item.url }}\r\n"
      loop:
        - { name: "SonarQube (SQ1)", url: "http://localhost:9000/" }
        - { name: "OWASP ZAP (OWZ1)", url: "http://owz1:8080/zap/" }
        - { name: "VulnShop Swagger (after run-app)", url: "http://127.0.0.1:{{ cr13_app_port }}/swagger" }

    - name: Lab folder shortcut on the desktop
      ansible.windows.win_shell: |
        $s = (New-Object -ComObject WScript.Shell).CreateShortcut('C:\Users\Public\Desktop\Lab folder.lnk')
        $s.TargetPath = '{{ cr13_lab_dir }}'
        $s.Save()
      args:
        creates: C:\Users\Public\Desktop\Lab folder.lnk

    - name: Remove the installers
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\Windows\Temp\cr13\jdk-25_windows-x64_bin.msi
        - C:\Windows\Temp\cr13\dotnet-install.ps1

    - name: Summary
      ansible.builtin.debug:
        msg:
          - ".NET SDKs: {{ cr13_dotnet.stdout_lines | default([]) | join(' | ') }}"
          - "{{ cr13_jdk.stdout | trim }}"
          - >-
            Postman: {{ 'skipped' if not cr13_install_postman
            else ('FAILED - install it manually as ' ~ cr13_trainee_user if cr13_postman is failed else 'installed') }}
          - >-
            VS Code extensions: {{ ('FAILED - ' ~ (cr13_vscode_ext.msg | default('see log')))
            if cr13_vscode_ext is failed else (cr13_vscode_ext.stdout_lines | default([]) | join(', ')) }}
          - "Application build: {{ (cr13_build.stdout_lines | default(['?']))[-3:] | join(' | ') }}"
          - "{{ cr13_portproxy.stdout_lines | default([]) }}"

    # A desktop session that existed while provisioning changed the machine
    # PATH keeps the old PATH (CR-14 lesson). Restarting last means the
    # trainee's first session sees every tool.
    - name: Restart SC1 so the first trainee session starts with the final PATH
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 30
      when: cr13_final_reboot
